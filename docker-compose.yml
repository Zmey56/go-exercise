version: '3.8'

services:
  ltp-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HTTP_ADDR=:8080
      - KRAKEN_URL=https://api.kraken.com
      - CACHE_TTL=60s
      - HTTP_TIMEOUT=3s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/ltp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

